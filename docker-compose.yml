services:
  server:
    # built by .github/workflows/image.yml - set LOSTCITY_IMAGE to pin a specific sha-<commit> tag.
    # to build locally instead: docker compose build
    image: ${LOSTCITY_IMAGE:-ghcr.io/samjwitt/server:latest}
    build: .
    pull_policy: missing
    ports:
      - '8888:8888' # web client and its game traffic
      - '43594:43594' # game, for the java client
      - '8898:8898' # management page
    volumes:
      # db.sqlite and players/ - the only state; everything else lives in the image
      - /srv/lostcity/save:/opt/lostcity/save
      # optional: override the world config baked in from config/world.json
      # - /srv/lostcity/world.json:/opt/lostcity/engine/data/config/world.json:ro
    # the engine saves every player on SIGTERM before exiting
    stop_grace_period: 60s
